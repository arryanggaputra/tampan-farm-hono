<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeternakTampan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; background: #f8fafc; color: #222; }
    .wrap { max-width: 420px; margin: 80px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 16px #0001; padding: 40px 32px; text-align: center; }
    .icon { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: #16a34a; border-radius: 14px; margin-bottom: 16px; }
    .icon svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    h1 { color: #15803d; font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #6b7280; font-size: 0.9rem; margin: 0 0 24px; line-height: 1.6; }
    a { display: block; background: #16a34a; color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background .15s; }
    a:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M6 10c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M3 16c0-2.2 1.8-4 4-4h10c2.2 0 4 1.8 4 4v2H3v-2z"/><path d="M8 10v2M16 10v2"/></svg>
    </div>
    <h1>PeternakTampan</h1>
    <p>Solusi modern untuk manajemen peternakan Anda.<br/>Pantau ternak, penjualan, dan pengeluaran dengan mudah.</p>
    <a href="/login">Login</a>
  </div>
</body>
</html>
